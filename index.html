<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header wrap">
    <h1>Tools</h1>
    <p>Bộ công cụ nhỏ chạy ngay trên trình duyệt.</p>
    <input class="search" id="search" type="search" placeholder="Tìm tool…" autocomplete="off">
  </header>

  <main class="wrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Không tìm thấy tool nào.</div>
  </main>

  <footer class="site-footer wrap">tools · <span id="count"></span></footer>

<script src="tools.js"></script>
<script>
"use strict";
const grid = document.getElementById("grid");
const visible = TOOLS.filter(t => !t.hidden);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function render(q) {
  q = q.trim().toLowerCase();
  const list = visible.filter(t => !q || [t.name, t.description, ...(t.tags || [])].join(" ").toLowerCase().includes(q));
  grid.innerHTML = list.map(t => `
    <a class="card" href="${esc(t.path)}/" target="_blank" rel="noopener">
      <div class="top"><div class="icon">${esc(t.icon || "🔧")}</div><h2>${esc(t.name)}</h2></div>
      <p>${esc(t.description || "")}</p>
      <div class="tags">${(t.tags || []).map(g => `<span class="tag">${esc(g)}</span>`).join("")}</div>
    </a>`).join("");
  document.getElementById("empty").hidden = list.length > 0;
}

document.getElementById("count").textContent = visible.length + " tool";
document.getElementById("search").addEventListener("input", e => render(e.target.value));
render("");
</script>
</body>
</html>
